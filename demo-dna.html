<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNA Helix</title>
  <!--
    "dna": a DNA double helix drawn with particles only.
    Standalone port of ykob/sketch-threejs, src/js/sketch/dna/  (https://github.com/ykob/sketch-threejs)
    MIT License, Copyright (c) 2021 yoichi kobayashi

    Same geometry, shaders and camera as the original. Changes needed to run on
    current three.js without the repo's gulp/webpack/glslify build:
      - WebGL1Renderer (removed in r163) -> WebGLRenderer
      - Clock (deprecated in r183)       -> Timer
      - shader file imports              -> inline strings
      - @ykob/js-util helpers            -> MathUtils.degToRad + a small debounce
      - page chrome (preloader, titles)  -> removed
  -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    .p-canvas-webgl { position: fixed; z-index: 1; top: 0; left: 0; display: block; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="canvas-webgl" class="p-canvas-webgl"></canvas>

  <script type="module">
    import * as THREE from 'three';

    // ==========
    // Shaders: glsl/DnaHelix.vs, glsl/DnaHelix.fs, glsl/postEffect.vs, glsl/postEffect.fs
    //
    const dnaHelixVs = /* glsl */ `
      attribute vec3 position;
      attribute float radian;
      attribute float radius;
      attribute float delay;

      uniform mat4 projectionMatrix;
      uniform mat4 viewMatrix;
      uniform mat4 modelMatrix;
      uniform float time;

      varying vec3 vColor;

      void main() {
        // coordinate transformation
        // (spin around the x axis at 0.4 rad/s, plus a per-particle wobble of +-1)
        vec3 updatePosition = position
          + vec3(
            sin(time * 4.0 + delay),
            sin(radian + time * 0.4) * (radius + sin(time * 4.0 + delay)),
            cos(radian + time * 0.4) * (radius + sin(time * 4.0 + delay))
            );
        vec4 mvPosition = viewMatrix * modelMatrix * vec4(updatePosition, 1.0);
        float distanceFromCamera = length(mvPosition.xyz);
        float pointSize = 1000.0 / distanceFromCamera * 1.6;

        vColor = vec3(0.8 - delay * 0.1, 0.6, 0.6);

        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = pointSize;
      }
    `;

    const dnaHelixFs = /* glsl */ `
      precision highp float;

      varying vec3 vColor;

      void main() {
        // Convert PointCoord to the other vec2 has a range from -1.0 to 1.0.
        vec2 p = gl_PointCoord * 2.0 - 1.0;

        // Draw circle
        // (a soft dot plus a thin ring around it)
        float radius = length(p);
        float opacity1 = (1.0 - smoothstep(0.5, 0.7, radius));
        float opacity2 = smoothstep(0.8, 1.0, radius) * (1.0 - smoothstep(1.0, 1.2, radius));

        gl_FragColor = vec4(vColor, (opacity1 + opacity2) * 0.5);
      }
    `;

    const postEffectVs = /* glsl */ `
      attribute vec3 position;
      attribute vec2 uv;

      varying vec2 vUv;

      void main() {
        vUv = uv;

        gl_Position = vec4(position, 1.0);
      }
    `;

    const postEffectFs = /* glsl */ `
      precision highp float;

      uniform float time;
      uniform sampler2D texture;
      uniform vec2 resolution;

      varying vec2 vUv;

      float random2(vec2 c){
        return fract(sin(dot(c.xy ,vec2(12.9898,78.233))) * 43758.5453);
      }
      float randomNoise(vec2 p) {
        return (random2(p - vec2(sin(time))) * 2.0 - 1.0) * 0.04;
      }

      void main() {
        // Convert uv to the other vec2 has a range from -1.0 to 1.0.
        vec2 p = vUv * 2.0 - 1.0;
        vec2 ratio = 1.0 / resolution;

        // Random Noise
        float rNoise = randomNoise(vUv);

        // RGB Shift
        // (red sampled to the left, green to the right: 1px at the center, 3px at the edges)
        float texColorR = texture2D(texture, vUv - vec2((2.0 * abs(p.x) + 1.0) * ratio.x, 0.0)).r;
        float texColorG = texture2D(texture, vUv + vec2((2.0 * abs(p.x) + 1.0) * ratio.x, 0.0)).g;
        float texColorB = texture2D(texture, vUv).b;

        // Sum total of colors.
        vec3 color = vec3(texColorR, texColorG, texColorB) + rNoise;

        gl_FragColor = vec4(color, 1.0);
      }
    `;

    // ==========
    // DnaHelix.js
    //
    class DnaHelix extends THREE.Points {
      constructor() {
        // Define Geometry
        const geometry = new THREE.BufferGeometry();

        // Define attributes of the instancing geometry
        const numHelix = 6000;   // points on the two strands
        const numLineSpace = 60; // rungs (base pairs) between the strands
        const numLine = 100;     // points per rung
        const numAmount = numHelix + numLineSpace * numLine;
        const baPositions = new THREE.BufferAttribute(new Float32Array(numAmount * 3), 3);
        const baRadians = new THREE.BufferAttribute(new Float32Array(numAmount), 1);
        const baRadiuses = new THREE.BufferAttribute(new Float32Array(numAmount), 1);
        const baDelays = new THREE.BufferAttribute(new Float32Array(numAmount), 1);

        // Strands: points spread along x from -150 to 150 with a fuzzy offset.
        // The angle turns 900deg (2.5 turns) over the length, and every other point
        // is shifted 180deg, which puts it on the opposite strand.
        for (let i = 0; i < numHelix; i++) {
          const random = Math.random();
          const diff = {
            x: (Math.random() * 2 - 1) * random * 6,
            y: (Math.random() * 2 - 1) * random * 6,
            z: (Math.random() * 2 - 1) * random * 6,
          };
          baPositions.setXYZ(
            i,
            ((i / numHelix) * 2 - 1) * 150 + diff.x,
            diff.y,
            diff.z
          );
          baRadians.setX(i, THREE.MathUtils.degToRad(i / numHelix * 900 + i % 2 * 180));
          baRadiuses.setX(i, 18);
          baDelays.setX(i, THREE.MathUtils.degToRad(Math.random() * 360));
        }

        // Rungs: lines of points through the axis (radius -18..18) joining the two strands.
        for (let j = 0; j < numLineSpace; j++) {
          const radians = THREE.MathUtils.degToRad(j / numLineSpace * 900);
          for (let k = 0; k < numLine; k++) {
            const index = j * numLine + k + numHelix;
            const random = Math.random();
            const diff = {
              x: (Math.random() * 2 - 1) * random * 1,
              y: (Math.random() * 2 - 1) * random * 1,
              z: (Math.random() * 2 - 1) * random * 1,
            };
            baPositions.setXYZ(
              index,
              ((j / numLineSpace) * 2 - 1) * 150 + diff.x,
              diff.y,
              diff.z
            );
            baRadians.setX(index, radians);
            baRadiuses.setX(index, (k / numLine * 2 - 1) * 18);
            baDelays.setX(index, THREE.MathUtils.degToRad(Math.random() * 360));
          }
        }
        geometry.setAttribute('position', baPositions);
        geometry.setAttribute('radian', baRadians);
        geometry.setAttribute('radius', baRadiuses);
        geometry.setAttribute('delay', baDelays);

        // Define Material
        const material = new THREE.RawShaderMaterial({
          uniforms: {
            time: { value: 0 },
          },
          vertexShader: dnaHelixVs,
          fragmentShader: dnaHelixFs,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });

        // Create Object3D
        super(geometry, material);
        this.name = 'DNA Helix';
      }
      render(time) {
        this.material.uniforms.time.value += time;
      }
    }

    // ==========
    // PostEffect.js
    //
    class PostEffect {
      constructor(texture) {
        this.uniforms = {
          time: { value: 0 },
          texture: { value: texture },
          resolution: { value: new THREE.Vector2() },
        };
        this.obj = null;
      }
      createObj() {
        // Define Geometry
        const geometry = new THREE.PlaneGeometry(2, 2);

        // Define Material
        const material = new THREE.RawShaderMaterial({
          uniforms: this.uniforms,
          vertexShader: postEffectVs,
          fragmentShader: postEffectFs,
        });

        // Create Object3D
        this.obj = new THREE.Mesh(geometry, material);
        this.obj.name = 'PostEffect';
      }
      resize(x, y) {
        this.uniforms.resolution.value.set(x, y);
      }
      render(time) {
        this.uniforms.time.value += time;
      }
    }

    // ==========
    // init.js
    //
    const debounce = (callback, duration) => {
      let timeoutId;
      return (event) => {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => callback(event), duration);
      };
    };

    // Define common variables
    const resolution = new THREE.Vector2();
    const canvas = document.getElementById('canvas-webgl');
    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      canvas: canvas,
    });
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera();
    const timer = new THREE.Timer();
    let isActive = false;

    // For the post effect.
    const renderTarget = new THREE.WebGLRenderTarget();
    const scenePE = new THREE.Scene();
    const cameraPE = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 2);

    // Define unique variables
    const dnaHelix = new DnaHelix();

    // For the post effect.
    const postEffect = new PostEffect(renderTarget.texture);
    postEffect.createObj();
    scenePE.add(postEffect.obj);

    // Define functions
    const render = (timestamp) => {
      timer.update(timestamp);
      // Time stands still while the window is inactive, as with the original's clock.stop().
      const time = isActive ? timer.getDelta() : 0;

      dnaHelix.render(time);

      // Render the main scene to frame buffer.
      renderer.setRenderTarget(renderTarget);
      renderer.render(scene, camera);

      // Render the post effect.
      postEffect.render(time);
      renderer.setRenderTarget(null);
      renderer.render(scenePE, cameraPE);
    };
    const resizeCamera = () => {
      // The shot is composed for a fixed 1200x800 frame. setViewOffset renders the
      // window-sized slice around its center, so the helix keeps the same pixel size
      // at any window size: larger windows add black around it, smaller ones crop it.
      camera.setFocalLength(50);
      camera.setViewOffset(
        1200,
        800,
        (resolution.x - 1200) / -2,
        (resolution.y - 800) / -2,
        resolution.x,
        resolution.y
      );
      camera.updateProjectionMatrix();
    };
    const resizeWindow = () => {
      resolution.set(window.innerWidth, window.innerHeight);
      resizeCamera();
      // Pixel ratio stays at 1 like the original: gl_PointSize and the RGB shift are in
      // framebuffer pixels, so a higher ratio would shrink the dots and the shift.
      renderer.setSize(resolution.x, resolution.y);
      renderTarget.setSize(resolution.x, resolution.y);
      postEffect.resize(resolution.x, resolution.y);
    };
    const on = () => {
      window.addEventListener('blur', () => {
        // this window is inactive.
        isActive = false;
      });
      window.addEventListener('focus', () => {
        // this window is active.
        isActive = true;
      });
      window.addEventListener('resize', debounce(resizeWindow, 1000));
    };

    // Initialize
    renderer.setClearColor(0x000000, 1.0);

    camera.aspect = 3 / 2;
    camera.far = 1000;
    camera.position.set(-110, -75, 45);
    camera.lookAt(0, 0, 0);

    scene.add(dnaHelix);

    on();
    resizeWindow();

    timer.connect(document); // no time jump after coming back to a hidden tab
    isActive = true;
    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
